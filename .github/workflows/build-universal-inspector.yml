name: Build UniversalUIInspector dylib

on:
  workflow_dispatch:
  push:
    branches: [ universal-inspector-build ]
    paths:
      - 'UniversalUIInspector/**'
      - 'build-ios-dylib.sh'
      - 'LEGACY_VS_CURRENT_ANALYSIS.md'
      - 'FEATURE_STATUS.md'
      - '.github/workflows/build-universal-inspector.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate iOS arm64 dylib
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x build-ios-dylib.sh
          ./build-ios-dylib.sh
      - name: Package build artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dist
          mkdir -p dist
          cp UniversalUIInspector.dylib BUILD_INFO.txt BUILD_LOG.txt SHA256.txt MACHO_HEADER.txt LINKED_FRAMEWORKS.txt UniversalUIInspector/README.txt dist/
          ditto -c -k --sequesterRsrc --keepParent dist UniversalUIInspector-arm64-BUILD.zip
      - uses: actions/upload-artifact@v4
        with:
          name: UniversalUIInspector-arm64
          path: |
            UniversalUIInspector.dylib
            UniversalUIInspector-arm64-BUILD.zip
            BUILD_INFO.txt
            BUILD_LOG.txt
            SHA256.txt
            MACHO_HEADER.txt
            LINKED_FRAMEWORKS.txt
          if-no-files-found: error
          retention-days: 30
