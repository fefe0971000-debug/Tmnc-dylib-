name: Build SatanabeCleanUI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show iOS SDK
        run: |
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path

      - name: Compile dylib (arm64 + arm64e)
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "Using SDK: $SDK"

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -fmodules \
            -O2 \
            -dynamiclib \
            -install_name @rpath/SatanabeCleanUI.dylib \
            -framework UIKit \
            -framework Foundation \
            -framework AVFoundation \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework UniformTypeIdentifiers \
            -o SatanabeCleanUI.dylib \
            SatanabeCleanUI.mm

          echo "---- file ----"
          file SatanabeCleanUI.dylib
          echo "---- lipo ----"
          lipo -info SatanabeCleanUI.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SatanabeCleanUI-dylib
          path: SatanabeCleanUI.dylib
          if-no-files-found: error
