name: Build SatanabeCleanUI v5.8.1 API Logger Build Fix
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          set -euxo pipefail
          test -f Source/SatanabeCleanUI.mm
          test -f Makefile

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build
        run: |
          set -euxo pipefail
          make clean
          make inspect

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp build/SatanabeCleanUI.dylib dist/
          shasum -a 256 build/SatanabeCleanUI.dylib > dist/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent dist SatanabeCleanUI-v5.8.1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SatanabeCleanUI-v5.8.1
          path: |
            build/SatanabeCleanUI.dylib
            SatanabeCleanUI-v5.8.1.zip
          if-no-files-found: error
          retention-days: 30
