name: Build SatanabeCleanUI dylib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Source/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

concurrency:
  group: satanabe-cleanui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repository layout
        run: |
          pwd
          find . -maxdepth 3 -type f -print | sort

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang --version
          make --version

      - name: Build and diagnose
        shell: bash
        run: |
          set -euxo pipefail
          make clean || true
          rm -rf build
          make inspect
          echo "=== build output ==="
          find build -maxdepth 2 -type f -print || true
          test -f build/SatanabeCleanUI.dylib
          file build/SatanabeCleanUI.dylib
          otool -L build/SatanabeCleanUI.dylib || true

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p artifact
          cp build/SatanabeCleanUI.dylib artifact/SatanabeCleanUI.dylib
          shasum -a 256 artifact/SatanabeCleanUI.dylib > artifact/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent artifact SatanabeCleanUI-build.zip

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SatanabeCleanUI-dylib
          path: |
            artifact/SatanabeCleanUI.dylib
            artifact/SHA256.txt
            SatanabeCleanUI-build.zip
          if-no-files-found: error
          retention-days: 7
